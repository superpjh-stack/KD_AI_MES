[project]
name = "kyungdong-ai"
version = "0.1.0"
description = "경동글로벌텍 제조AI 시스템 (SF26179182)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.12",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pypdf>=5.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyungdong"]
